name: scheduled-messenger unit tests

on:
  push:
    paths:
      - "scheduled-messenger/**"
      - ".github/workflows/scheduled-messenger-tests.yml"
  workflow_dispatch:

concurrency:
  group: scheduled-messenger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scheduled-messenger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Core (pure Kotlin) unit tests
        run: ./gradlew :core:test --no-daemon --stacktrace

      - name: App (Room / WorkManager / Robolectric) unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            scheduled-messenger/core/build/reports/tests/
            scheduled-messenger/app/build/reports/tests/
            scheduled-messenger/core/build/test-results/
            scheduled-messenger/app/build/test-results/
          retention-days: 14
