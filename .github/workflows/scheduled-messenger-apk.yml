name: scheduled-messenger APK

on:
  push:
    paths:
      - "scheduled-messenger/**"
      - ".github/workflows/scheduled-messenger-apk.yml"
  workflow_dispatch:

concurrency:
  group: scheduled-messenger-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: scheduled-messenger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # A stable signing key makes later builds installable over earlier ones. Provide it as
      # repository secrets (SIDELOAD_KEYSTORE_BASE64, SIDELOAD_KEYSTORE_PASSWORD, SIDELOAD_KEY_ALIAS,
      # SIDELOAD_KEY_PASSWORD). Without them the APK is signed with a throwaway debug key.
      - name: Prepare signing key
        env:
          SIDELOAD_KEYSTORE_BASE64: ${{ secrets.SIDELOAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIDELOAD_KEYSTORE_BASE64" ]; then
            echo "$SIDELOAD_KEYSTORE_BASE64" | base64 -d > sideload.keystore
            echo "Using the repository's sideload signing key."
          else
            keytool -genkeypair -v -keystore sideload.keystore -storepass sideload -keypass sideload \
              -alias sideload -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Scheduled Messenger sideload, OU=dev, O=kiwi-cup, C=US"
            echo "::warning::No SIDELOAD_KEYSTORE_BASE64 secret: signed with a throwaway key. Installing a later build over this one will require uninstalling first."
          fi

      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon

      - name: Build installable APK
        env:
          SIDELOAD_KEYSTORE_PASSWORD: ${{ secrets.SIDELOAD_KEYSTORE_PASSWORD || 'sideload' }}
          SIDELOAD_KEY_ALIAS: ${{ secrets.SIDELOAD_KEY_ALIAS || 'sideload' }}
          SIDELOAD_KEY_PASSWORD: ${{ secrets.SIDELOAD_KEY_PASSWORD || 'sideload' }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Name the APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release.apk "scheduled-messenger-${VERSION}-${GITHUB_SHA::7}.apk"
          ls -la scheduled-messenger-*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-messenger-apk
          path: scheduled-messenger/scheduled-messenger-*.apk
          retention-days: 30

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: scheduled-messenger/app/build/reports/lint-results-debug.html
          retention-days: 14
